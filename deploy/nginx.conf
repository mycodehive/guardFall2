# Replace domain and certificate paths with actual values; configure TLS first.
server {
    listen 80;
    server_name guardfall.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name guardfall.example.com;
    ssl_certificate /etc/letsencrypt/live/guardfall.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guardfall.example.com/privkey.pem;
    client_max_body_size 210M;
    location /static/ { alias /srv/guardfall2/staticfiles/; }
    # Private uploads must be served through authenticated Django endpoints.
    location /media/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
